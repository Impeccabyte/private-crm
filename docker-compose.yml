# Impeccabyte CRM — local stack.
#   docker compose up --build        start everything
#   docker compose down -v           stop and wipe the database
# App: http://localhost:3000   Mailpit (password-reset emails): http://localhost:8025

x-app-env: &app-env
  env_file: .env
  environment:
    DATABASE_URL: postgres://crm:crm@db:5432/crm
    SMTP_DEFAULT_HOST: mailpit
    SMTP_DEFAULT_PORT: "1025"
    NODE_ENV: production
    UPLOAD_DIR: /app/uploads
    CLAMAV_HOST: clamav
    CLAMAV_PORT: "3310"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Virus scanning for uploaded files (clamd on 3310). The first start downloads signatures (a few minutes);
  # until it's ready, uploads are held as "pending" and the worker scans them once it's up.
  clamav:
    image: clamav/clamav-debian:1.4
    volumes:
      - clamdb:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  # One-shot: apply migrations, then seed (idempotent). App and worker wait for it.
  migrate:
    build: .
    image: impeccabyte-crm:local
    <<: *app-env
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: impeccabyte-crm:local
    <<: *app-env
    volumes:
      - uploads:/app/uploads
    command: ["npm", "run", "start"]
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Background jobs: webhook processing, Maverick syncs.
  worker:
    image: impeccabyte-crm:local
    <<: *app-env
    volumes:
      - uploads:/app/uploads
    command: ["npm", "run", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  # Encrypted lead-form uploads (merchant statements etc.)
  uploads:
  # ClamAV signature database (kept so restarts don’t re-download it)
  clamdb:
